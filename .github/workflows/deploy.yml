# Publish the sheet to shoebox.idfkit.com on every push to main.
#
# There is no stored AWS key. The job asks GitHub for a short-lived OIDC token
# and trades it for the role the CDK stack created, which trusts exactly this
# repository and this branch. `id-token: write` is what allows that request;
# without it the token is never minted and the credential step fails.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys racing would interleave their uploads and invalidate each other's
# build. They queue instead, and the older one is not cancelled, because a
# half-uploaded site is worse than a late one.
concurrency:
  group: deploy-shoebox
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # `prebuild` stages ~50 MB of engine assets, the schema bundle and the
      # station index out of node_modules, so the install has to be complete
      # before the build can run.
      - run: npm ci
      - run: npm run build

      # The role ARN is a secret rather than a variable purely so the log masks
      # it: the runner echoes every `with:` input verbatim, and this repository
      # is public, so a variable would publish the AWS account id. The ARN is
      # not itself a credential, but there is no reason to broadcast it.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - run: npm run deploy
        env:
          SHOEBOX_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
